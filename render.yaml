services:
  - type: web
    name: full-stack-multi-noise-classifcation
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn --workers 1 --threads 2 --timeout 120 --bind 0.0.0.0:$PORT app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: PORT
        value: 10000
